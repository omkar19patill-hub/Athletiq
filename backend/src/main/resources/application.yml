server:
  port: 8080

spring:
  application:
    name: athletiq-backend

  datasource:
    url: jdbc:mysql://localhost:3306/sportsphere_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
    open-in-view: false

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: UTC

application:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000

  cors:
    allowed-origins: http://localhost:5173

  stripe:
    secret-key: ${STRIPE_SECRET_KEY:sk_test_mock_secret_key_athletiq}
    publishable-key: ${STRIPE_PUBLISHABLE_KEY:pk_test_mock_publishable_key_athletiq}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_mock_webhook_secret}
    currency: ${STRIPE_CURRENCY:inr}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.sportsphere: DEBUG
    org.springframework.security: INFO
